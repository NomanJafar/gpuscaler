[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpuscaler"
version = "0.1.0"
description = "Queue-depth-driven autoscaler for GPU inference replicas (KEDA-style) with cold-start mitigation, validated against replayed traffic traces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "tokenbench @ git+https://github.com/NomanJafar/tokenbench"]
plots = ["matplotlib>=3.8"]

[project.scripts]
gpuscaler = "gpuscaler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuscaler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
