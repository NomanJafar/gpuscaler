[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpuscaler"
version = "0.1.0"
description = "Queue-depth-driven autoscaler for GPU inference replicas (KEDA-style) with cold-start mitigation, validated against replayed traffic traces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/gpuscaler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
